# =============================================
#  Nginx config for Hostinger VPS
#  Place at: /etc/nginx/sites-available/assurechitfunds
#  Then: ln -s /etc/nginx/sites-available/assurechitfunds /etc/nginx/sites-enabled/
# =============================================

# ──── Backend API + Socket.IO ────
server {
    listen 80;
    server_name api.assure.fund;

    # Redirect HTTP to HTTPS (after SSL setup)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.assure.fund;

    # SSL (Certbot will fill these)
    ssl_certificate /etc/letsencrypt/live/api.assure.fund/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.assure.fund/privkey.pem;

    client_max_body_size 10M;

    # API requests
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO needs long timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# ──── Web Portal ────
server {
    listen 80;
    server_name assure.fund www.assure.fund;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name assure.fund www.assure.fund;

    ssl_certificate /etc/letsencrypt/live/assure.fund/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assure.fund/privkey.pem;

    root /var/www/assurechitfunds/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# ──── Admin Portal ────
server {
    listen 80;
    server_name admin.assure.fund;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.assure.fund;

    ssl_certificate /etc/letsencrypt/live/admin.assure.fund/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.assure.fund/privkey.pem;

    root /var/www/assurechitfunds/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
