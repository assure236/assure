# =============================================
#  Nginx config for Hostinger VPS
#  Optimized for 50K concurrent users
#  Place at: /etc/nginx/sites-available/assurechitfunds
#  Then: ln -s /etc/nginx/sites-available/assurechitfunds /etc/nginx/sites-enabled/
# =============================================

# ──── Upstream for backend (PM2 cluster) ────
upstream assure_backend {
    least_conn;
    server 127.0.0.1:5000;
    keepalive 64;
}

# ──── Backend API + Socket.IO ────
server {
    listen 80;
    server_name api.assure.fund;

    # Redirect HTTP to HTTPS (after SSL setup)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.assure.fund;

    # SSL (Certbot will fill these)
    ssl_certificate /etc/letsencrypt/live/assure.fund/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assure.fund/privkey.pem;

    # SSL optimization
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    # Gzip (defense in depth — also compressed by Node)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Proxy buffering for high throughput
    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # API requests
    location / {
        proxy_pass http://assure_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO needs long timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Health check — bypass rate limit
    location = /health {
        proxy_pass http://assure_backend;
        access_log off;
    }
}

# ──── Web Portal ────
server {
    listen 80;
    server_name assure.fund www.assure.fund;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name assure.fund www.assure.fund;

    ssl_certificate /etc/letsencrypt/live/assure.fund/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assure.fund/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/assurechitfunds/web/build;
    index index.html;

    # Gzip for static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (React build outputs hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Service worker should not be cached
    location = /service-worker.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

# ──── Admin Portal ────
server {
    listen 80;
    server_name admin.assure.fund;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.assure.fund;

    ssl_certificate /etc/letsencrypt/live/assure.fund/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assure.fund/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/assurechitfunds/admin/build;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
