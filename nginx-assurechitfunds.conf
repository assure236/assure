# =============================================
#  Nginx config for Hostinger VPS
#  Optimized for 50K concurrent users
# =============================================

upstream assure_backend {
    least_conn;
    server 127.0.0.1:5000;
    keepalive 64;
}

# Backend API HTTP -> HTTPS
server {
    listen 80;
    server_name api.assure.fund;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.assure.fund;

    ssl_certificate /etc/letsencrypt/live/assure.fund/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assure.fund/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    proxy_buffering on;
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    location / {
        proxy_pass http://assure_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location = /health {
        proxy_pass http://assure_backend;
        access_log off;
    }
}

# Web Portal HTTP -> HTTPS
server {
    listen 80;
    server_name assure.fund www.assure.fund;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name assure.fund www.assure.fund;

    ssl_certificate /etc/letsencrypt/live/assure.fund/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/assure.fund/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/assurechitfunds/web/build;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /service-worker.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

