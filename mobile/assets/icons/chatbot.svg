<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Head -->
  <rect x="14" y="14" width="36" height="30" rx="10" fill="#29B6F6"/>
  <!-- Antenna base -->
  <rect x="29" y="6" width="6" height="10" rx="3" fill="#2196F3"/>
  <!-- Antenna ball -->
  <circle cx="32" cy="5" r="4" fill="#1565C0"/>
  <!-- Left eye -->
  <circle cx="24" cy="26" r="4" fill="white"/>
  <circle cx="24" cy="26" r="2" fill="#1565C0"/>
  <!-- Right eye -->
  <circle cx="40" cy="26" r="4" fill="white"/>
  <circle cx="40" cy="26" r="2" fill="#1565C0"/>
  <!-- Smile -->
  <path d="M24 34c0 4 7 7 8 7s8-3 8-7" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Body -->
  <rect x="18" y="46" width="28" height="14" rx="7" fill="#2196F3"/>
  <!-- Left ear -->
  <rect x="6" y="22" width="8" height="12" rx="4" fill="#2196F3"/>
  <!-- Right ear -->
  <rect x="50" y="22" width="8" height="12" rx="4" fill="#2196F3"/>
  <!-- Body line -->
  <line x1="27" y1="52" x2="37" y2="52" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>