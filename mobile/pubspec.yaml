name: assure_chitfunds
description: Assure Chit Funds Mobile Application
publish_to: 'none'
version: 1.0.0+4004

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  http: ^1.1.2
  http_parser: ^4.0.2
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  
  # Navigation
  go_router: ^16.1.0
  
  # File Handling
  file_picker: ^10.3.10
  image_picker: ^1.0.5
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # Local Notifications
  flutter_local_notifications: ^18.0.1

  # WebSocket / Real-time
  socket_io_client: ^3.1.4
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  
  # KYC / DigiLocker
  webview_flutter: ^4.4.4
  
  # Share
  share_plus: ^12.0.1
  
  # Biometric Auth
  local_auth: ^2.3.0
  
  # Location
  geolocator: ^13.0.2
  
  # Charts
  fl_chart: ^0.71.0

  # SVG Icons
  flutter_svg: ^2.0.10

  # On-device face detection (local liveness checks)
  google_mlkit_face_detection: ^0.13.0
  
  # Payments
  flutter_cashfree_pg_sdk: ^2.3.2+49

  # Firebase
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
