name: assure_chitfunds
description: Assure Chit Funds Mobile Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  
  # State Management
  provider: ^6.1.1
  
  # Networking
  http: ^1.1.2
  dio: ^5.4.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0
  
  # Navigation
  go_router: ^16.1.0
  
  # Forms & Validation
  flutter_form_builder: ^9.1.1
  form_builder_validators: ^11.1.2
  
  # File Handling
  file_picker: ^10.3.10
  image_picker: ^1.0.5
  
  # PDF
  flutter_pdfview: ^1.3.2
  pdf: ^3.10.7
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.11
  
  # Notifications — push handled by AWS SNS via backend

  # WebSocket / Real-time
  socket_io_client: ^3.1.4
  
  # Utils
  intl: ^0.19.0
  url_launcher: ^6.2.2
  connectivity_plus: ^7.0.0
  package_info_plus: ^9.0.0
  
  # KYC / DigiLocker
  webview_flutter: ^4.4.4
  
  # Share
  share_plus: ^12.0.1
  
  # Charts
  fl_chart: ^0.71.0
  
  # Animations
  lottie: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
