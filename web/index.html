  <!-- Old long landing removed. Production nginx serves SPA from /build. -->
  <script>
    // If this file is hit from web root, send users into the SPA entry.
    var spa = '/';
    if (location.pathname.indexOf('/build') === -1) {
      // Prefer react-app.html when present (postbuild), else / which SPA owns on build root.
      spa = '/react-app.html';
    }
    location.replace(spa);
  </script>
  <meta http-equiv="refresh" content="0;url=/react-app.html" />
</head>
